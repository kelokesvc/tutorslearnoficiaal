<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Hub</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #1b2433 0%, var(--bg) 60%) fixed;
    color: var(--text);
    min-height: 100vh;
  }
  header { text-align: center; padding: 48px 16px 16px; }
  h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.2rem); letter-spacing: -1px; }
  h1 span { color: var(--accent); }
  .count { color: var(--muted); margin-top: 8px; }
  .search-wrap { max-width: 480px; margin: 20px auto 8px; padding: 0 16px; }
  input {
    width: 100%; padding: 14px 18px; font-size: 1rem;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); border-radius: 999px; outline: none;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(88,166,255,.25); }
  main {
    max-width: 1200px; margin: 0 auto; padding: 24px 16px 64px;
    display: grid; gap: 14px;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  }
  a.game {
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    gap: 10px; min-height: 120px; padding: 18px 12px; text-align: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    color: var(--text); text-decoration: none; font-weight: 600;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  a.game:hover {
    transform: translateY(-4px); border-color: var(--accent);
    box-shadow: 0 8px 24px rgba(88,166,255,.18);
  }
  .badge {
    width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
    font-size: 1.2rem; font-weight: 800; color: #fff;
  }
  .empty { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 40px; display: none; }
</style>
</head>
<body>
<header>
  <h1> 67 <span>67</span></h1>
  <div class="count" id="count"></div>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search games..." autofocus>
  </div>
</header>

<main id="grid">
  <div class="empty" id="empty">No games found 😢</div>
</main>

<script>
  const games = [
    ["2DShooting.html", "2D Shooting"],
    ["3dash.html", "3 Dash"],
    ["BrawlStars.html", "Brawl Stars"],
    ["Dino.html", "Dino"],
    ["DriveMad.html", "Drive Mad"],
    ["EagleCraft.html", "EagleCraft"],
    ["GeometryDashWorld.html", "Geometry Dash World"],
    ["Helios.html", "Helios"],
    ["RedBall4.html", "Red Ball 4"],
    ["basketballlegends.html", "Basketball Legends"],
    ["blockblast.html", "Block Blast"],
    ["clUltimatecardrivingsimulator.html", "Ultimate Car Driving Simulator"],
    ["clamongus.html", "Among Us"],
    ["clangrybirds.html", "Angry Birds"],
    ["clblazedrifter.html", "Blaze Drifter"],
    ["clboxingrandom.html", "Boxing Random"],
    ["clcrossyroad.html", "Crossy Road"],
    ["clcuttherope.html", "Cut the Rope"],
    ["cldeathchase.html", "Death Chase"],
    ["cldunkshot.html", "Dunk Shot"],
    ["clextremerun3d.html", "Extreme Run 3D"],
    ["clfallguys.html", "Fall Guys"],
    ["clfireboyandwatergirl2.html", "Fireboy & Watergirl 2"],
    ["clfruitninja.html", "Fruit Ninja"],
    ["cluno.html", "Uno"],
    ["cookieclicker.html", "Cookie Clicker"],
    ["crazycars.html", "Crazy Cars"],
    ["edyscarsimulator.html", "Edy's Car Simulator"],
    ["escaperoad.html", "Escape Road"],
    ["fivenightsatie.html", "Five Nights at Ie"],
    ["flappybird.html", "Flappy Bird"],
    ["retrobowl.html", "Retro Bowl"],
    ["rocketgoal.html", "Rocket Goal"],
    ["slope2.html", "Slope 2"],
    ["snowrider.html", "Snow Rider"],
    ["spaceclicker.html", "Space Clicker"],
    ["subwaysurfers.html", "Subway Surfers"],
    ["templerun2.html", "Temple Run 2"],
    ["timeshooter2.html", "Time Shooter 2"],
    ["towerblocks.html", "Tower Blocks"]
  ];

  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  const search = document.getElementById("search");
  document.getElementById("count").textContent = games.length + " games";

  const cards = games.map(([file, name], i) => {
    const a = document.createElement("a");
    a.className = "game";
    a.href = file;
    a.dataset.name = name.toLowerCase();
    const badge = document.createElement("div");
    badge.className = "badge";
    badge.style.background = `hsl(${(i * 47) % 360}, 65%, 45%)`;
    badge.textContent = name.replace(/[^a-zA-Z0-9]/g, "").charAt(0).toUpperCase();
    const label = document.createElement("span");
    label.textContent = name;
    a.append(badge, label);
    grid.insertBefore(a, empty);
    return a;
  });

  search.addEventListener("input", () => {
    const q = search.value.trim().toLowerCase();
    let shown = 0;
    cards.forEach(c => {
      const match = c.dataset.name.includes(q);
      c.style.display = match ? "" : "none";
      if (match) shown++;
    });
    empty.style.display = shown ? "none" : "block";
  });
</script>
</body>
</html>
